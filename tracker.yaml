    state: in_progress
    summary: The Expo app has every version 1 phone screen. Sign in, profile setup, the live groups list, Account and sign out are wired to the dev backend; chat, group info, new group and search still run on gallery fixtures.
    theory: theory.md#fast-and-reliable
    code:
