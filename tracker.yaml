schema_version: 7
principle: Track observable outcomes for Q9 Chat, not completed setup.
sizing: Estimate remaining work; use S for one focused change, M for connected work, and L for substantial work.
outcomes:
  - id: chat.data_model
    title: Groups, members and messages exist in Convex
    area: foundation
    state: in_progress
    summary: The schema models profiles with account deletion, groups and pairs, memberships, removals, private read state and unread rows, posts, deleted placeholders and member events, single-use uploads, reactions with counts, typing, push devices and reports. It passed three design reviews against the mock and is deployed to the dev deployment. No function uses it yet.
    theory: theory.md#groups
    code:
      - convex/schema.ts
    priority: P0
    size: S
    size_reason: The access helpers that every public function goes through.
    remaining:
      - Add the four access classes (anyone, identity, active, member) that every public function goes through.

  - id: chat.sign_in_groups
    title: Sign in and land in groups
    area: groups
    state: in_progress
    summary: Email sign-in, profile setup with a photo, live groups, Account and sign out run on web and on the phone, and the phone end-to-end test passes on an iOS simulator and an Android emulator against the dev backend. The phone sends Google and Apple to WorkOS and back through the phone-callback page, but no real provider sign-in has been completed.
    theory: theory.md#version-1-journeys
    code:
      - apps/web/src/journey/journey.tsx
      - apps/web/src/lib/session.tsx
      - apps/mobile/src/journey/Journey.tsx
      - apps/mobile/src/session/client.ts
      - convex/profiles.ts
      - convex/groups.ts
    priority: P0
    size: M
    size_reason: Only the provider click-through with a real account and a run on a physical phone remain.
    remaining:
      - Verify Google and Apple click-through in the browser and on a phone with a real account.
      - Run the phone journey on a physical device.

  - id: chat.create_groups
    title: Create a group or start a group of two
    area: groups
    state: in_progress
    summary: Group creation, people search, pairs, adding members and joining by invite are wired to the dev backend on web and on the phone. The phone end-to-end test passes on an iOS simulator and an Android emulator. A saved invite survives sign-in once and is then cleared, and a write that may never end (offline) can be left after a warning. An HTTPS invite link does not open the phone app yet.
    theory: theory.md#groups
    code:
      - apps/web/src/journey/groups.tsx
      - tests/j2-web.e2e.ts
      - apps/mobile/src/journey/NewGroupJourney.tsx
      - apps/mobile/src/journey/GroupInfoJourney.tsx
      - apps/mobile/src/journey/JoinJourney.tsx
      - tests/j2-phone.e2e.ts
      - tests/j2-android.e2e.ts
      - convex/groups.ts
    priority: P0
    size: S
    size_reason: Only the HTTPS app link and a run on a physical phone remain.
    remaining:
      - Open the phone app from an HTTPS invite link (iOS associated domains, an Android verified intent filter, and the Worker's apple-app-site-association and assetlinks.json), which needs the Apple team ID and the release certificate from the first EAS build.
      - Run the group journey on a physical phone.

  - id: chat.send_messages
    title: Send text, images, files and voice notes
    area: messages
    state: in_progress
    summary: Web text, images, files and voice notes send with immediate feedback, safe retries and per-group drafts. Sending on the phone remains.
    theory: theory.md#messages
    code:
      - apps/web/src/journey/text-outbox.ts
      - apps/web/src/journey/text-composer.tsx
      - apps/web/src/journey/media-outbox.ts
      - apps/web/src/journey/voice-recorder.ts
    priority: P0
    size: L
    size_reason: Sending text and attachments on the phone remains.
    remaining:
      - Send text, images, files and voice notes on the phone, with immediate delivery, safe retries and per-group drafts.

  - id: chat.quote_replies
    title: Reply by quoting and jump to the original
    area: messages
    state: in_progress
    summary: Web replies show a quote in the composer and sent message, preserve it through retries, and jump outside the loaded history with a return to latest. Phone wiring remains.
    theory: theory.md#messages
    code:
      - apps/web/src/journey/history.tsx
      - apps/web/src/journey/quoted-reply.ts
      - tests/j5-j6-web.e2e.ts
    priority: P0
    size: M
    size_reason: The phone needs quote composition and history navigation.
    remaining:
      - Quote and jump to the original on the phone.

  - id: chat.edit_react_typing
    title: Edit or delete your messages, react, and see who is typing
    area: messages
    state: in_progress
    summary: Web members edit and delete their own messages, react with one of five emoji, see reactor names and report other messages. Web typing shipped with J4. Phone wiring remains.
    theory: theory.md#messages
    code:
      - apps/web/src/journey/message-actions.tsx
      - tests/j5-j6-web.e2e.ts
    priority: P1
    size: M
    size_reason: The phone needs editing, deletion, reactions and typing.
    remaining:
      - Edit, delete, react, report and show typing on the phone.

  - id: chat.unread_and_read_state
    title: See what is new since you last looked
    area: messages
    state: in_progress
    summary: The web app opens at a fixed unread divider, pages older history, follows live messages and records privately what was viewed in a focused window. The phone app still needs these behaviors connected.
    theory: theory.md#calm
    code:
      - apps/web/src/journey/history.tsx
      - apps/web/src/chat/timeline-viewport.ts
      - tests/j3-web.e2e.ts
    priority: P0
    size: M
    size_reason: Connect the existing phone screens to shared read cursors and live history.
    remaining:
      - Connect unread counts, the opening divider and focused-view read state on phone.

  - id: chat.search
    title: Find an old message with search
    area: messages
    state: in_progress
    summary: Web search finds messages across current groups and opens old results in place. Phone search still needs wiring.
    theory: theory.md#version-1-journeys
    code:
      - apps/web/src/journey/search.tsx
      - apps/web/src/journey/history.tsx
      - tests/j7-web.e2e.ts
    priority: P1
    size: S
    size_reason: Connect the phone search screen to the existing backend.
    remaining:
      - Search message text across the person's groups and open the result in place on phone.

  - id: chat.calm_notifications
    title: Get notified only when something needs you
    area: notifications
    state: in_progress
    summary: Web members can choose notification modes and mute groups. Push setup and phone controls remain.
    theory: theory.md#calm
    code: []
    priority: P0
    size: L
    size_reason: Web push, APNs and FCM delivery plus per-group settings and deep links.
    remaining:
      - Notify on mentions and replies by default; let a person choose every message per group.
      - Deliver through web push, APNs and FCM, and open the notification at the message.
      - Add the phone mute controls; web mute settings and grey counts work.

  - id: chat.leave_group
    title: Leave a group or remove a member
    area: groups
    state: in_progress
    summary: Web members can leave or remove another member with confirmation. Removed people lose history and can clear the removal notice; phone controls remain.
    theory: theory.md#groups
    code:
      - apps/web/src/journey/group-controls.tsx
      - convex/groups.ts
    priority: P1
    size: S
    size_reason: Wire the existing membership mutations to the phone controls.
    remaining:
      - Let phone members leave, remove members and clear removal notices.

  - id: chat.store_requirements
    title: Delete your account and report a message
    area: foundation
    state: in_progress
    summary: Web members can delete their account and report a message. The phone app remains.
    theory: theory.md#version-1-journeys
    code:
      - apps/web/src/journey/journey.tsx
      - apps/web/src/journey/message-actions.tsx
      - tests/j5-j6-web.e2e.ts
    priority: P1
    size: M
    size_reason: Account deletion across data and storage, plus a simple report flow.
    remaining:
      - Delete an account and its personal data from the phone app.
      - Report a message for review from the phone app.

  - id: mobile.app
    title: The phone app offers every journey
    area: mobile
    state: in_progress
    summary: The Expo app has every version 1 phone screen. Sign in, profile setup, the live groups list, Account and sign out, New group, Group info with Add people and the invite link, and joining by link are wired to the dev backend; chat and search still run on gallery fixtures, and Group info's Leave, Remove, Mute and notification choices say they come in a later journey.
    theory: theory.md#fast-and-reliable
    code:
      - apps/mobile
    priority: P0
    size: L
    size_reason: Most journeys still need their screens wired to Convex and a device run.
    remaining:
      - Wire chat and search to the backend.
      - Wire Group info's Leave, Remove, Mute and notification choices to the backend.

  - id: release.first_live
    title: Q9's team uses Q9 Chat on chat.q9labs.ai and TestFlight
    area: release
    state: planned
    summary: Nothing is deployed. A fresh Convex production, the web Worker on chat.q9labs.ai and EAS builds are needed.
    theory: theory.md#stack
    code: []
    priority: P0
    size: M
    size_reason: Production setup across Convex, Cloudflare, sign-in providers and EAS, each needing Hasan's approval.
    remaining:
      - Create the Convex production and set its settings.
      - Deploy the web app to chat.q9labs.ai and allow it in the production WorkOS environment.
      - Build with EAS and submit to TestFlight and Play internal testing.
      - Serve apple-app-site-association and assetlinks.json from the Worker with the first build's team ID and certificate, so HTTPS invite links open the phone app.
