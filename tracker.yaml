schema_version: 7
principle: Track observable outcomes for Q9 Chat, not completed setup.
sizing: Estimate remaining work; use S for one focused change, M for connected work, and L for substantial work.
outcomes:
  - id: chat.data_model
    title: Groups, members and messages exist in Convex
    area: foundation
    state: in_progress
    summary: The schema models profiles with account deletion, groups and pairs, memberships, removals, private read state and unread rows, posts, deleted placeholders and member events, single-use uploads, reactions with counts, typing, push devices and reports. It passed three design reviews against the mock and is deployed to the dev deployment. No function uses it yet.
    theory: theory.md#groups
    code:
      - convex/schema.ts
    priority: P0
    size: S
    size_reason: The access helpers that every public function goes through.
    remaining:
      - Add the four access classes (anyone, identity, active, member) that every public function goes through.

  - id: chat.sign_in_groups
    title: Sign in and land in groups
    area: groups
    state: in_progress
    summary: Email sign-in, profile setup with a photo, live groups, Account and sign out run on web and on the phone, and the phone end-to-end test passes on an iOS simulator and an Android emulator against the dev backend. The phone sends Google and Apple to WorkOS and back through the phone-callback page, but no real provider sign-in has been completed.
    theory: theory.md#version-1-journeys
    code:
      - apps/web/src/journey/journey.tsx
      - apps/web/src/lib/session.tsx
      - apps/mobile/src/journey/Journey.tsx
      - apps/mobile/src/session/client.ts
      - convex/profiles.ts
      - convex/groups.ts
    priority: P0
    size: M
    size_reason: Only the provider click-through with a real account and a run on a physical phone remain.
    remaining:
      - Verify Google and Apple click-through in the browser and on a phone with a real account.
      - Run the phone journey on a physical device.

  - id: chat.create_groups
    title: Create a group or start a group of two
    area: groups
    state: in_progress
    summary: Group creation, people search, pairs, adding members and joining by invite are wired to the dev backend on web and on the phone. The phone end-to-end test passes on an iOS simulator and an Android emulator. A saved invite survives sign-in once and is then cleared, and a write that may never end (offline) can be left after a warning. The Worker serves the app link files and the builds declare the domain, but no device has opened an HTTPS invite link yet.
    theory: theory.md#groups
    code:
      - apps/web/src/journey/groups.tsx
      - tests/j2-web.e2e.ts
      - apps/mobile/src/journey/NewGroupJourney.tsx
      - apps/mobile/src/journey/GroupInfoJourney.tsx
      - apps/mobile/src/journey/JoinJourney.tsx
      - tests/j2-phone.e2e.ts
      - tests/j2-android.e2e.ts
      - convex/groups.ts
    priority: P0
    size: S
    size_reason: Only a run on a physical phone remains.
    remaining:
      - Open the phone app from an HTTPS invite link on a physical iPhone and Android phone.
      - Run the group journey on a physical phone.

  - id: chat.calm_notifications
    title: Get notified only when something needs you
    area: notifications
    state: in_progress
    summary: Web and phone alerts, group settings and message links are built. Desktop delivery and real iPhone delivery still need proof.
    theory: theory.md#calm
    code:
      - apps/web/src/journey/notifications.tsx
      - apps/web/public/notifications.js
      - tests/j8-web.e2e.ts
      - apps/mobile/src/journey/PhoneNotifications.tsx
      - tests/j8-push.e2e.ts
    priority: P0
    size: M
    size_reason: Desktop delivery and real iPhone delivery checks remain.
    remaining:
      - Prove browser push delivery and notification click-through from a logged-in M4 desktop.
      - Prove real iPhone notification delivery through APNs on a signed build.

  - id: release.first_live
    title: Q9's team uses Q9 Chat on chat.q9labs.ai and TestFlight
    area: release
    state: in_progress
    summary: The web app runs on chat.q9labs.ai against the production Convex deployment utmost-alligator-175, and serves apple-app-site-association and assetlinks.json. iOS build 9 is in TestFlight for the Q9 group and Android version code 6 is on the Play internal track, both with phone notifications and app links. The Q9 TestFlight group has four testers who are invited but have not accepted, and the Play internal track has no testers added yet.
    theory: theory.md#stack
    code:
      - apps/web/wrangler.jsonc
      - apps/web/src/lib/app-links.ts
      - apps/mobile/eas.json
      - docs/runbooks/deploy.md
    priority: P0
    size: S
    size_reason: Only tester access and checks on real devices remain.
    remaining:
      - Add the Q9 team to the Play internal testing list in Play Console and share the opt-in link.
      - Confirm a TestFlight tester installs build 9, receives a push and opens an HTTPS invite link in the app.
