name: Deploy web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - convex/**
      - convex.json
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - turbo.json
      - .github/workflows/deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Convex API
        run: pnpm convex:codegen
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Build workspace
        run: pnpm build

      - name: Deploy Convex
        run: pnpm convex:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy web
        run: pnpm deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
