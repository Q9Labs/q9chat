name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    env:
      # Codegen needs a configured deployment; the local anonymous one needs no
      # account or secret, and the CLI downloads its backend on first use.
      CONVEX_DEPLOYMENT: anonymous:anonymous-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install gate tools
        uses: ./.github/actions/gate-tools

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run full gate
        run: pnpm gate:full

      - name: Upload gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gate-report
          path: gate.report.json
          if-no-files-found: ignore
