name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # The codegen drift lane regenerates convex/_generated against the dev
      # deployment; codegen never changes the code running there.
      VITE_CONVEX_URL: https://quixotic-crab-23.convex.cloud
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install gate tools
        uses: ./.github/actions/gate-tools

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate project docs
        run: pnpm tracker:check && pnpm changelog:check

      - name: Configure server-only secret canary
        run: printf '%s\n' 'WORKOS_API_KEY=q9-auth-server-only-canary' 'WORKOS_CLIENT_ID=test-only' > apps/web/.dev.vars

      - name: Run base gate
        id: base-gate
        run: pnpm exec q9gate run --base origin/main

      - name: Show test output on gate failure
        if: ${{ failure() && steps.base-gate.outcome == 'failure' }}
        run: |
          # Preserve the first failure even if the diagnostic rerun passes.
          find apps packages -path '*/.turbo/turbo-test.log' -type f -print -exec cat {} \;
          pnpm turbo run test --output-logs=errors-only

      - name: Build browser artifact for secret exclusion
        # The base gate builds only changed packages, so build the web app's
        # workspace dependencies here too.
        run: pnpm --filter "@q9chat/web..." build

      - name: Check built client excludes server secrets
        run: node --test apps/web/tests/client-bundle.test.ts

      - name: Install Chromium
        run: pnpm --filter @q9chat/web exec playwright install --with-deps chromium

      - name: Check browser auth lifecycle
        run: pnpm --filter @q9chat/web exec playwright test e2e/auth-session.spec.ts --workers=1

      - name: Upload gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate.report.json
          if-no-files-found: ignore
