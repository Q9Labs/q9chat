name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate project docs
        run: pnpm tracker:check && pnpm changelog:check

      - name: Run base gate
        run: pnpm exec q9gate run --base origin/main

      - name: Upload gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: gate.report.json
          if-no-files-found: ignore
