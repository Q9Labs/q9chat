name: Gate tools
description: Install the scanners q9gate calls, pinned and checksummed.

runs:
  using: composite
  steps:
    - name: Install gate tools
      shell: bash
      run: |
        curl --fail --location --silent --show-error \
          --output /tmp/gitleaks.tar.gz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

        curl --fail --location --silent --show-error \
          --output /tmp/actionlint.tar.gz \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
        tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
        sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

        curl --fail --location --silent --show-error \
          --output /tmp/osv-scanner \
          https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
        echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  /tmp/osv-scanner" | sha256sum --check
        sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner

        pipx install semgrep==1.175.0
