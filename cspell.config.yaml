version: "0.2"
language: en
useGitignore: true
# WorkOS client IDs are identifiers, not words.
ignoreRegExpList:
  - /\bclient_[0-9A-Z]{26}\b/g
files:
  - "**/*.{md,mdx,ts,tsx,js,mjs,cjs,json,jsonc,yaml,yml}"
ignorePaths:
  - node_modules/**
  - dist/**
  - coverage/**
  - .turbo/**
  - .wrangler/**
  - .output/**
  - pnpm-lock.yaml
  - cspell-baseline.txt
  - .worktrees/**
  - convex/_generated/**
words:
  - APP
  - AuthKit
  - WorkOS
  - chdir
  - Cloudflare
  - codegen
  - conname
  - conrelid
  - CSpell
  - depcruise
  - esbuild
  - fast-check
  - fontsource
  - Geist
  - labsai
  - lefthook
  - Millis
  - oxfmt
  - oxlint
  - pnpm
  - PKCE
  - keepalive
  - HMAC
  - q9gate
  - q9labs
  - regclass
  - semgrep
  - shellcheck
  - sonner
  - syncpack
  - TanStack
  - timestamptz
  - topbar
  - tsdown
  - tsgolint
  - UDID
  - nosemgrep
  - ellipsize
  - Tweaker
  - vite
  - vitejs
  - vitest
  - workerd
  - worktree
  - worktrees
  - Wrangler
  - ratelimits
  # Arabic greeting used to verify Unicode message preservation.
  - مرحبا
  # React Native's accessibility action name for a long press.
  - longpress
  # The people in the mock's seed data, used by the web gallery fixtures.
  - Bilal
  - Hasan
  - Rahmatullah
  - Rana
  - Shoaib
  - Siddiqui
  - Yahya
  # Product and vendor words: the Figtree font, the CollabEZ Apple account, the logo "wordmark".
  - CollabEZ
  - Figtree
  - wordmark
  # React Native and mock words in the phone app: the Pressable component, the react-doctor rule name rn-no-scrollview-mapped-list, the mock's "typers" and "chev" names, and a seed message.
  - Pressable
  - scrollview
  - typers
  - chev
  - Biryani
  # The mock's screen name for the New group dialog, kept as the gallery state id.
  - newgroup
  - ratelimits
