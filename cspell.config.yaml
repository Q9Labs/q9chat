version: "0.2"
language: en
useGitignore: true
files:
  - "**/*.{md,mdx,ts,tsx,js,mjs,cjs,json,jsonc,yaml,yml}"
ignorePaths:
  - node_modules/**
  - dist/**
  - coverage/**
  - .turbo/**
  - .wrangler/**
  - .output/**
  - apps/web/src/locales/**/*.po
  - pnpm-lock.yaml
  - cspell-baseline.txt
  - .worktrees/**
