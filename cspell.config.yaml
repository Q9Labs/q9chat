  - lefthook
  - lingui
  - Millis
  - OpenRouter
  - OpenTofu
  - oxfmt
  - oxlint
  - pnpm
  - q9gate
  - q9labs
  - regclass
  - semgrep
  - shellcheck
  - sonner
  - Stryker
  - syncpack
  - TanStack
  - timestamptz
  - topbar
  - tsdown
  - tsgolint
  - Tweaker
  - vite
  - vitejs
