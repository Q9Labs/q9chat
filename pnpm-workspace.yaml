packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true
  workerd: true

catalog:
  react: 19.3.0
  react-doctor: 0.9.14
  react-dom: 19.3.0
  "@tanstack/react-router": 1.170.42
  "@tanstack/react-start": 1.168.61
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@fontsource-variable/geist": 5.3.0
  "@fontsource-variable/geist-mono": 5.3.0
  "@types/node": 26.6.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.1
  "@vitejs/plugin-react": 6.1.1
  "@cloudflare/vite-plugin": 1.59.0
  "@cloudflare/workers-types": 5.20260924.1
  wrangler: 4.138.0
  convex: 1.46.0
  "@workos-inc/authkit-react": 0.16.3
  "@playwright/test": 1.63.0
  turbo: 2.11.3
  tsdown: 0.23.0
  oxlint: 1.85.0
  oxlint-tsgolint: 7.0.2003
  oxfmt: 0.70.0
  fallow: 3.28.0
  dependency-cruiser: 18.4.0
  syncpack: 15.3.3
  cspell: 10.3.3
  lefthook: 2.1.14
  typescript: 7.0.2
  "@q9labsai/config-depcruise": https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-depcruise-0.3.0.tgz
  "@q9labsai/config-oxlint": https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-oxlint-0.3.0.tgz
  "@q9labsai/config-semgrep": https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-semgrep-0.3.0.tgz
  "@q9labsai/config-tsconfig": https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-config-tsconfig-0.3.0.tgz
  "@q9labsai/cli": https://github.com/Q9Labs/q9stack/releases/download/v0.4.3/q9labsai-cli-0.4.3.tgz
  "@q9labsai/gates": https://github.com/Q9Labs/q9stack/releases/download/v0.3.1/q9labsai-gates-0.3.1.tgz
  "@q9labsai/ui": https://github.com/Q9Labs/q9stack/releases/download/v0.3.0/q9labsai-ui-0.3.0.tgz

# dependency-cruiser 18 needs TypeScript <7 to analyze .ts/.tsx files.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

# q9stack packages depend on each other through GitHub release tarball URLs.
blockExoticSubdeps: false

# q9stack packages ship only as GitHub release tarballs, so the npm registry has
# no release time for pnpm's minimum release age check to read.
minimumReleaseAgeExclude:
  - "@q9labsai/*"
  # Expo SDK 58 and React Native 0.88 shipped within the 3-day window. Pin exact versions so
  # nothing else skips the check, and delete these lines once they are three days old.
  - "@expo/cli@58.1.11"
  - "@expo/metro-config@58.0.14"
  - "@expo/package-manager@1.14.2"
  - "@expo/prebuild-config@58.0.14"
  - "@expo/router-server@58.0.14"
  - "@expo/schema-utils@58.0.2"
  - "@react-native/asset-utils@0.88.0"
  - "@react-native/babel-plugin-codegen@0.88.0"
  - "@react-native/codegen@0.88.0"
  - "@react-native/community-cli-plugin@0.88.0"
  - "@react-native/debugger-frontend@0.88.0"
  - "@react-native/debugger-shell@0.88.0"
  - "@react-native/dev-middleware@0.88.0"
  - "@react-native/gradle-plugin@0.88.0"
  - "@react-native/js-polyfills@0.88.0"
  - "@react-native/normalize-colors@0.88.0"
  - "@react-native/virtualized-lists@0.88.0"
  - "babel-preset-expo@58.0.17"
  - "expo-asset@58.0.16"
  - "expo-modules-core@58.0.22"
  - "expo-modules-jsi@58.0.15"
  - "expo@58.0.14"
  - "react-native@0.88.0"
  - "react-native-svg@15.16.0"
  - "expo-system-ui@58.0.6"
  - "expo-splash-screen@58.0.10"
  - "expo-router@58.0.23"
  - "expo-glass-effect@58.0.4"
  - "expo-dev-launcher@58.0.14"
  - "expo-dev-client@58.0.14"

overrides:
  # q9stack packages are GitHub release tarballs (see catalog), also for their own dependencies.
  "@q9labsai/cli": "catalog:"
  "@q9labsai/diagnostics": https://github.com/Q9Labs/q9stack/releases/download/v0.4.0/q9labsai-diagnostics-0.4.0.tgz
  "@q9labsai/gates": "catalog:"
  "@q9labsai/config-depcruise": "catalog:"
  "@q9labsai/config-oxlint": "catalog:"
  "@q9labsai/config-semgrep": "catalog:"
  "@q9labsai/config-tsconfig": "catalog:"
  "@q9labsai/ui": "catalog:"
  # Security fixes: undici and sharp advisories in wrangler/miniflare; one TanStack Start for GHSA-qx66-fv34-fjm8.
  undici: 7.30.0
  sharp: 0.35.5
  # GHSA-w5hq-g745-h8pq: Expo's prebuild tooling pulls uuid 7; 11.1.1 is the first fixed release with the same API.
  "uuid@7.0.3": 11.1.1
  "@tanstack/react-start": "catalog:"
